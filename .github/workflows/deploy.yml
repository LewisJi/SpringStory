name: QNAP springstory CI/CD

on:
  push:
    branches:
      - sourceconfig  

jobs:
  build-and-deploy:
    runs-on: qnap-spring-env  

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'       
          distribution: 'temurin'
          cache: 'gradle'         

      - name: 3. Grant execute permission for gradlew
        run: chmod +x gradlew      

      - name: 4. Build with Gradle
        run: ./gradlew bootJar -x test  # 打包並跳過測試以加速部署

      - name: 5. Build Image and Run Container
        run: |
          # 1. 將打包好的 JAR 檔與 Dockerfile 編譯成當地 Image
          docker build -t springstory:latest .
          
          # 2. 如果舊的容器存在，先停止並刪除
          docker stop springstory || true
          docker rm springstory || true
          
          # 3. 啟動全新的容器
          docker run -d \
            --name springstory \
            --restart unless-stopped \
            --network app-1_default \
            -p 8082:8080 \
            springstory:latest
