name: QNAP springstory CI/CD

on:
  push:
    branches:
      - sourceconfig

jobs:
  build-and-deploy:
    runs-on: qnap-spring-env

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 3. High-speed Download and Cache Gradle 9.6.0
        run: |
          TARGET_DIR="$HOME/.gradle/wrapper/dists/gradle-9.6.0-bin/3f750f03d77e42327c5f9fcb9992110088330a32"
          mkdir -p "$TARGET_DIR"
          
          wget -q --show-progress https://gradle.org -O "$TARGET_DIR/gradle-9.6.0-bin.zip"
          
          touch "$TARGET_DIR/gradle-9.6.0-bin.zip.lck"
          touch "$TARGET_DIR/gradle-9.6.0-bin.zip.ok"

      - name: 4. Build with Gradle
        run: ./gradlew bootJar -x test

      - name: 5. Build Image and Run Container
        run: |
          docker build -f DockerFile -t springstory:latest .
          docker stop springstory || true
          docker rm springstory || true
          docker run -d \
            --name springstory \
            --restart unless-stopped \
            -p 8082:8080 \
            -e pgreDB_user="lewis" \
            -e pgreDB_pass="1111" \
            springstory:latest
