name: QNAP springstory CI/CD

on:
  push:
    branches:
      - sourceconfig

jobs:
  build-and-deploy:
    runs-on: qnap-spring-env

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: 3. Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 4. Build with Gradle
        run: ./gradlew bootJar -x test

      - name: 5. Build Image and Run Container
        run: |
          docker build -f DockerFile -t springstory:latest .
          docker stop springstory || true
          docker rm springstory || true
          docker run -d \
            --name springstory \
            --restart unless-stopped \
            -p 8082:8080 \
            -e pgreDB_user="lewis" \
            -e pgreDB_pass="1111" \
            springstory:latest
          
