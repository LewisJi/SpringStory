name: QNAP springstory CI/CD

on:
  push:
    branches:
      - sourceconfig

jobs:
  build-and-deploy:
    runs-on: qnap-spring-env

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. List all files to check structure
        run: |
          echo "=== Current working directory ==="
          pwd
          echo "=== Listing top-level files ==="
          ls -la
          echo "=== Searching for gradlew location ==="
          find . -name "gradlew"

      - name: 3. Grant execute permission for gradlew (Temp fallback)
        run: echo "Waiting for file structure log..."
